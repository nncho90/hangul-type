<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle Workshop — Type Hangeul</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f4f8;   --l1: #ffffff;    --l2: #f8fafc;   --l3: #f1f5f9;
    --bd: #e2e8f0;   --bdhi: #cbd5e1;
    --thi: #0f172a;  --tmd: #475569;   --tlo: #94a3b8;
    --blue: #2563eb; --green: #10b981; --yellow: #f59e0b;
    --red: #ef4444;  --orange: #f97316; --purple: #8b5cf6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 14px/1.45 'Inter', system-ui, sans-serif;
    color: var(--thi);
    background: var(--bg);
    min-height: 100vh;
  }
  .topbar {
    position: sticky; top: 0; z-index: 50;
    height: 52px;
    background: var(--l1);
    border-bottom: 1px solid var(--bd);
    display: flex; align-items: center;
    padding: 0 20px;
    gap: 16px;
  }
  .topbar h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .topbar .sub { color: var(--tmd); font-size: 12px; }
  .tabs { display: flex; gap: 4px; margin-left: auto; }
  .tab {
    padding: 6px 14px; border-radius: 20px;
    font-size: 12px; font-weight: 600;
    color: var(--tmd);
    background: transparent;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .tab.active { color: var(--thi); background: var(--l3); border-color: var(--bd); }
  .tab:hover:not(.active) { color: var(--thi); background: var(--l2); }

  main { max-width: 1400px; margin: 0 auto; padding: 24px 20px 80px; }
  .panel { display: none; }
  .panel.active { display: block; }

  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }

  .card {
    background: var(--l1);
    border: 1px solid var(--bd);
    border-radius: 14px;
    padding: 18px;
  }
  .card h3 { margin: 0 0 4px; font-size: 14px; font-weight: 700; }
  .card .meta { font-size: 11px; color: var(--tmd); font-family: 'JetBrains Mono', monospace; margin-bottom: 12px; }
  .card .row {
    display: flex; flex-wrap: wrap; gap: 8px;
    align-items: flex-end;
    padding: 12px;
    background: var(--l3);
    border-radius: 10px;
    margin-bottom: 8px;
    min-height: 80px;
  }
  .row + .row { margin-top: 0; }
  .row-label {
    width: 100%;
    font-size: 10px;
    color: var(--tlo);
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .frame {
    position: relative;
    background: repeating-conic-gradient(#e2e8f0 0% 25%, #f8fafc 0% 50%) 0 0/16px 16px;
    border-radius: 6px;
    border: 1px solid var(--bd);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }
  .frame img {
    image-rendering: -webkit-optimize-contrast;
    object-fit: contain;
    display: block;
  }
  .frame .miss {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column;
    background: rgba(239, 68, 68, 0.92);
    color: white;
    font-size: 9px; font-weight: 700;
    letter-spacing: 0.08em;
  }
  .frame .miss code { font-size: 8px; font-family: 'JetBrains Mono', monospace; opacity: 0.85; padding: 0 4px; word-break: break-all; }
  .frame.missing .miss { display: flex; }
  .frame .cap {
    position: absolute; bottom: 2px; left: 4px;
    font-size: 9px;
    color: var(--tmd);
    background: rgba(255,255,255,0.8);
    border-radius: 3px;
    padding: 1px 4px;
    font-family: 'JetBrains Mono', monospace;
  }

  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 20px;
    font-size: 10px; font-weight: 600;
    background: var(--l3); color: var(--tmd);
    margin-right: 4px;
  }
  .pill.melee { background: #fef3c7; color: #92400e; }
  .pill.spell { background: #ede9fe; color: #5b21b6; }
  .pill.ranged { background: #dbeafe; color: #1e40af; }
  .pill.boss  { background: #fee2e2; color: #991b1b; }

  .size-row {
    display: flex; align-items: center; gap: 8px;
    margin-top: 8px;
    font-size: 11px; color: var(--tmd);
  }
  .size-row input[type="range"] { flex: 1; }
  .size-row code { font-family: 'JetBrains Mono', monospace; min-width: 48px; text-align: right; }

  .legend {
    display: flex; gap: 16px;
    font-size: 11px; color: var(--tmd);
    background: var(--l1);
    border: 1px solid var(--bd);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 16px;
  }
  .legend .swatch {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 2px; margin-right: 4px; vertical-align: middle;
  }
  .legend .swatch.ok { background: var(--green); }
  .legend .swatch.miss { background: var(--red); }

  .tuning {
    background: var(--l1);
    border: 1px solid var(--bd);
    border-radius: 14px;
    padding: 18px;
  }
  .tuning textarea {
    width: 100%;
    min-height: 420px;
    font: 12px/1.5 'JetBrains Mono', monospace;
    border: 1px solid var(--bd);
    border-radius: 8px;
    padding: 10px 12px;
    background: var(--l2);
    resize: vertical;
  }
  .tuning .actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn {
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--bd);
    background: var(--l1);
    color: var(--thi);
    font-size: 12px; font-weight: 600;
    cursor: pointer;
  }
  .btn.primary { background: var(--blue); color: white; border-color: var(--blue); }
  .btn:hover { background: var(--l3); }
  .btn.primary:hover { background: #1d4ed8; }

  .bg-grid { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  .bg-card { border-radius: 12px; overflow: hidden; border: 1px solid var(--bd); aspect-ratio: 16/9; position: relative; background: #000; }
  .bg-card img { width: 100%; height: 100%; object-fit: cover; }
  .bg-card .label { position: absolute; bottom: 8px; left: 8px; font-size: 11px; color: white; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; }

  .summary {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin-bottom: 20px;
  }
  .kpi {
    background: var(--l1); border: 1px solid var(--bd); border-radius: 14px;
    padding: 14px 16px;
  }
  .kpi-l { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--tlo); }
  .kpi-v { font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', monospace; margin-top: 2px; color: var(--thi); }
  .kpi-n { font-size: 11px; color: var(--tmd); margin-top: 2px; }
  .kpi.bl .kpi-v { color: var(--blue); }
  .kpi.gr .kpi-v { color: var(--green); }
  .kpi.re .kpi-v { color: var(--red); }
  .kpi.ye .kpi-v { color: var(--yellow); }
</style>
</head>
<body>

<div class="topbar">
  <h1>🛠️ Battle Workshop</h1>
  <span class="sub">live preview of <code>battle-config.js</code></span>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="players">Players</button>
    <button class="tab" data-tab="enemies">Enemies</button>
    <button class="tab" data-tab="bosses">Bosses</button>
    <button class="tab" data-tab="vfx">VFX</button>
    <button class="tab" data-tab="bgs">Backgrounds</button>
    <button class="tab" data-tab="xp">XP curve</button>
    <button class="tab" data-tab="tuning">Tuning</button>
  </div>
</div>

<main>
  <div class="legend">
    <span><span class="swatch ok"></span> file loads</span>
    <span><span class="swatch miss"></span> 404 — fallback to emoji in game</span>
    <span style="margin-left:auto" id="missingCount">…</span>
  </div>

  <div class="summary" id="summary"></div>

  <div class="panel active" data-panel="players" id="panel-players"></div>
  <div class="panel" data-panel="enemies" id="panel-enemies"></div>
  <div class="panel" data-panel="bosses" id="panel-bosses"></div>
  <div class="panel" data-panel="vfx" id="panel-vfx"></div>
  <div class="panel" data-panel="bgs" id="panel-bgs"></div>
  <div class="panel" data-panel="xp" id="panel-xp"></div>
  <div class="panel" data-panel="tuning" id="panel-tuning">
    <div class="tuning">
      <h3 style="margin:0 0 4px;font-size:14px">Live config (JSON)</h3>
      <p style="margin:0 0 12px;font-size:12px;color:var(--tmd)">
        Edit any field, click <b>Apply</b> to re-render the previews. Workshop only —
        nothing writes back to disk. Use <b>Copy as JS</b> to paste into <code>battle-config.js</code>.
      </p>
      <textarea id="tuningJson" spellcheck="false"></textarea>
      <div class="actions">
        <button class="btn primary" id="applyBtn">Apply</button>
        <button class="btn" id="copyJsBtn">Copy as JS</button>
        <button class="btn" id="resetBtn">Reset to file</button>
        <span id="tuningMsg" style="font-size:11px;color:var(--tmd);align-self:center;margin-left:auto"></span>
      </div>
    </div>
  </div>
</main>

<script src="battle-config.js"></script>
<script>
'use strict';

let CFG;
const SPRITE_PATH = (file) => 'sprites/' + file + '.png';

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

let missingTracker = { total: 0, missing: 0 };

// Build a single sprite frame box. Tracks load/error to surface missing files
// (which is exactly how the boss double-emoji bug manifested in the real game).
function frame(file, sizePx, caption) {
  const f = el('div', 'frame');
  f.style.width = sizePx + 'px';
  f.style.height = sizePx + 'px';
  const img = new Image();
  img.style.width = sizePx + 'px';
  img.style.height = sizePx + 'px';
  img.alt = '';
  missingTracker.total++;
  img.addEventListener('load', () => {
    f.classList.remove('missing');
    updateLegend();
  });
  img.addEventListener('error', () => {
    f.classList.add('missing');
    missingTracker.missing++;
    updateLegend();
  });
  img.src = SPRITE_PATH(file);
  f.appendChild(img);
  const miss = el('div', 'miss', '<div>MISSING</div><code>' + file + '.png</code>');
  f.appendChild(miss);
  if (caption) f.appendChild(el('div', 'cap', caption));
  return f;
}

function updateLegend() {
  const t = document.getElementById('missingCount');
  if (!t) return;
  if (missingTracker.missing === 0) {
    t.innerHTML = '<b style="color:var(--green)">' + missingTracker.total + '</b> sprites loaded · 0 missing';
  } else {
    t.innerHTML = '<b style="color:var(--red)">' + missingTracker.missing + ' missing</b> of ' + missingTracker.total;
  }
}

function row(label, frames) {
  const r = el('div', 'row');
  r.appendChild(el('div', 'row-label', label));
  frames.forEach(f => r.appendChild(f));
  return r;
}

// ─── Players panel ──────────────────────────────────────────────────────────

function renderPlayers() {
  const host = document.getElementById('panel-players');
  host.innerHTML = '';
  const grid = el('div', 'grid');
  for (const p of CFG.players) {
    // Game uses 158px for the on-stage player render; preview at that size.
    const stageSize = 158;
    const card = el('div', 'card');
    card.appendChild(el('h3', null, p.label));
    card.appendChild(el('div', 'meta',
      'Lv ' + p.lv + ' · tier ' + p.tier + ' · ' +
      '<span class="pill ' + p.attackType + '">' + p.attackType + '</span>'
    ));

    card.appendChild(row('IDLE', [
      frame(p.spriteBack, stageSize, 'back'),
      frame(p.spriteFront, stageSize, 'front')
    ]));
    card.appendChild(row('STRIKE 1–4', [1,2,3,4].map(n =>
      frame(p.spriteStrike + '-' + n, stageSize, '#' + n)
    )));
    card.appendChild(row('WALK 1–4', [1,2,3,4].map(n =>
      frame(p.spriteBack + '-walk-' + n, stageSize, '#' + n)
    )));
    card.appendChild(row('JUMP / LAND', [
      frame(p.spriteBack + '-jump-1', stageSize, 'jump-1'),
      frame(p.spriteBack + '-jump-2', stageSize, 'jump-2'),
      frame(p.spriteBack + '-land-1', stageSize, 'land-1'),
      frame(p.spriteBack + '-land-2', stageSize, 'land-2')
    ]));
    grid.appendChild(card);
  }
  host.appendChild(grid);
}

// ─── Enemies panel ──────────────────────────────────────────────────────────

function renderEnemies() {
  const host = document.getElementById('panel-enemies');
  host.innerHTML = '';
  const grid = el('div', 'grid');
  for (const tier of [1,2,3,4,5]) {
    const file = CFG.enemyTiers[tier];
    if (!file) continue;
    const sizePx = CFG.tierSizePx[tier] || 101;
    const card = el('div', 'card');
    card.appendChild(el('h3', null, 'Tier ' + tier + ' — <span style="font-family:JetBrains Mono,monospace;font-size:12px;font-weight:600">' + file + '</span>'));
    const fb = (CFG.tierEmoji[tier] || []).slice(0, 4).join(' ');
    card.appendChild(el('div', 'meta', sizePx + 'px on stage · emoji fallback: ' + fb));
    card.appendChild(row('WALK 1–4', [1,2,3,4].map(n =>
      frame(file + '-walk-' + n, sizePx, '#' + n)
    )));
    card.appendChild(row('HIT 1–2', [1,2].map(n =>
      frame(file + '-hit-' + n, sizePx, '#' + n)
    )));
    grid.appendChild(card);
  }
  host.appendChild(grid);
}

// ─── Bosses panel ───────────────────────────────────────────────────────────

function renderBosses() {
  const host = document.getElementById('panel-bosses');
  host.innerHTML = '';
  const grid = el('div', 'grid');
  const sizePx = CFG.tierSizePx.boss || 234;
  for (const b of CFG.bosses) {
    const card = el('div', 'card');
    card.appendChild(el('h3', null, b.name + ' <span class="pill boss">boss</span>'));
    card.appendChild(el('div', 'meta', b.subtitle + ' · ' + b.sprite));
    card.appendChild(row('STAGE FRAMES (used by buildMonsterEl)', [
      frame(b.sprite, sizePx, 'idle'),
      frame(b.sprite + '-step', sizePx, 'step')
    ]));
    card.appendChild(row('LEGACY WALK FRAMES (game.html ≤ 5971f5d)', [
      frame(b.sprite + '-walk-1', sizePx, 'walk-1'),
      frame(b.sprite + '-walk-3', sizePx, 'walk-3')
    ]));
    const note = el('div', 'meta', 'Emoji fallback: ' + b.emoji + ' · flavor: <i>' + b.flavor + '</i>');
    note.style.marginTop = '8px';
    card.appendChild(note);
    grid.appendChild(card);
  }
  host.appendChild(grid);
}

// ─── VFX panel ──────────────────────────────────────────────────────────────

function renderVfx() {
  const host = document.getElementById('panel-vfx');
  host.innerHTML = '';
  const grid = el('div', 'grid');
  const entries = Object.entries(CFG.vfx);
  for (const [key, v] of entries) {
    const card = el('div', 'card');
    card.appendChild(el('h3', null, key));
    card.appendChild(el('div', 'meta', v.sprite + ' · glyph: ' + (v.glyph || '—')));
    card.appendChild(row('SPRITE', [ frame(v.sprite, 96, '96px') ]));
    if (v.c1 || v.color) {
      const sw = el('div', 'row');
      sw.appendChild(el('div', 'row-label', 'COLORS'));
      const c1 = el('div'); c1.style.cssText = 'width:60px;height:60px;border-radius:8px;background:' + (v.c1 || v.color) + ';border:1px solid var(--bd)';
      sw.appendChild(c1);
      if (v.c2) {
        const c2 = el('div'); c2.style.cssText = 'width:60px;height:60px;border-radius:8px;background:' + v.c2 + ';border:1px solid var(--bd)';
        sw.appendChild(c2);
      }
      card.appendChild(sw);
    }
    grid.appendChild(card);
  }
  host.appendChild(grid);
}

// ─── Backgrounds panel ──────────────────────────────────────────────────────

function renderBackgrounds() {
  const host = document.getElementById('panel-bgs');
  host.innerHTML = '';
  const grid = el('div', 'bg-grid');
  const names = ['01-village', '02-forest', '03-mountain', '04-cave', '05-temple', '06-battlefield', '07-palace'];
  for (const n of names) {
    const c = el('div', 'bg-card');
    const img = new Image();
    img.src = 'sprites/backgrounds/' + n + '.png';
    img.onerror = () => { c.style.background = 'var(--red)'; };
    c.appendChild(img);
    c.appendChild(el('div', 'label', n));
    grid.appendChild(c);
  }
  host.appendChild(grid);
}

// ─── XP curve panel ─────────────────────────────────────────────────────────

function renderXp() {
  const host = document.getElementById('panel-xp');
  host.innerHTML = '';
  const card = el('div', 'card');
  card.appendChild(el('h3', null, 'XP threshold per level'));
  const x = CFG.xp;
  card.appendChild(el('div', 'meta',
    'base = ' + x.base + ' · step = ' + x.step + ' · ' +
    'late discount on lv ' + x.lateDiscount.levels.join(',') + ' (×' + x.lateDiscount.factor + ')'
  ));

  // Tier-1 kill yields ~18 XP. Compute approx kills-per-level.
  const TIER1_XP = 18;
  const table = el('table');
  table.style.cssText = 'width:100%;border-collapse:collapse;font-family:JetBrains Mono,monospace;font-size:12px;margin-top:12px';
  table.innerHTML = '<thead><tr style="background:var(--l3)"><th style="text-align:left;padding:6px 10px">Level</th><th style="text-align:right;padding:6px 10px">XP needed</th><th style="text-align:right;padding:6px 10px">≈ Tier-1 kills</th><th style="text-align:right;padding:6px 10px">Cumulative XP</th></tr></thead>';
  const tbody = el('tbody');
  let cum = 0;
  for (let lv = 1; lv <= 20; lv++) {
    let base = x.base + x.step * (lv - 1);
    if (x.lateDiscount.levels.includes(lv)) base = Math.round(base * x.lateDiscount.factor);
    cum += base;
    const tr = el('tr');
    tr.style.borderTop = '1px solid var(--bd)';
    tr.innerHTML = '<td style="padding:6px 10px">L' + lv + ' → L' + (lv + 1) +
      '</td><td style="text-align:right;padding:6px 10px">' + base +
      '</td><td style="text-align:right;padding:6px 10px;color:var(--tmd)">' + Math.ceil(base / TIER1_XP) +
      '</td><td style="text-align:right;padding:6px 10px;color:var(--tmd)">' + cum + '</td>';
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  card.appendChild(table);
  host.appendChild(card);
}

// ─── Summary KPIs ───────────────────────────────────────────────────────────

function renderSummary() {
  const host = document.getElementById('summary');
  host.innerHTML = '';
  const kpis = [
    { l: 'Player tiers',  v: CFG.players.length, n: 'L1 → L' + CFG.players[CFG.players.length - 1].lv, c: 'bl' },
    { l: 'Enemy tiers',   v: Object.keys(CFG.enemyTiers).length, n: 'walk + hit', c: 'gr' },
    { l: 'Bosses',        v: CFG.bosses.length, n: 'idle + step', c: 'ye' },
    { l: 'XP base / step', v: CFG.xp.base + ' / ' + CFG.xp.step, n: 'L1→L2 = ' + CFG.xp.base + ' XP', c: 're' }
  ];
  for (const k of kpis) {
    const c = el('div', 'kpi ' + k.c);
    c.innerHTML = '<div class="kpi-l">' + k.l + '</div><div class="kpi-v">' + k.v + '</div><div class="kpi-n">' + k.n + '</div>';
    host.appendChild(c);
  }
}

// ─── Tuning panel (live JSON edit) ──────────────────────────────────────────

function renderTuning() {
  const ta = document.getElementById('tuningJson');
  ta.value = JSON.stringify(stripFns(CFG), null, 2);
}

function stripFns(o) {
  return JSON.parse(JSON.stringify(o, (k, v) => (typeof v === 'function' ? undefined : v)));
}

document.getElementById('applyBtn').addEventListener('click', () => {
  const ta = document.getElementById('tuningJson');
  const msg = document.getElementById('tuningMsg');
  try {
    const next = JSON.parse(ta.value);
    CFG = { ...next, playerForLevel: window.BATTLE_CONFIG.playerForLevel };
    missingTracker = { total: 0, missing: 0 };
    renderAll();
    msg.textContent = 'applied · ' + new Date().toLocaleTimeString();
    msg.style.color = 'var(--green)';
  } catch (e) {
    msg.textContent = 'parse error: ' + e.message;
    msg.style.color = 'var(--red)';
  }
});

document.getElementById('copyJsBtn').addEventListener('click', () => {
  const ta = document.getElementById('tuningJson');
  const msg = document.getElementById('tuningMsg');
  navigator.clipboard.writeText(ta.value).then(() => {
    msg.textContent = 'JSON copied to clipboard';
    msg.style.color = 'var(--green)';
  });
});

document.getElementById('resetBtn').addEventListener('click', () => {
  CFG = window.BATTLE_CONFIG;
  missingTracker = { total: 0, missing: 0 };
  renderAll();
  document.getElementById('tuningMsg').textContent = 'reset to file';
});

// ─── Tabs ───────────────────────────────────────────────────────────────────

document.getElementById('tabs').addEventListener('click', (e) => {
  if (!e.target.classList.contains('tab')) return;
  const name = e.target.dataset.tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === e.target));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.dataset.panel === name));
});

// ─── Boot ───────────────────────────────────────────────────────────────────

function renderAll() {
  renderSummary();
  renderPlayers();
  renderEnemies();
  renderBosses();
  renderVfx();
  renderBackgrounds();
  renderXp();
  renderTuning();
  updateLegend();
}

CFG = window.BATTLE_CONFIG;
renderAll();
</script>
</body>
</html>
